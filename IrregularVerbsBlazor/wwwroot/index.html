<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IrregularVerbsBlazor</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="IrregularVerbsBlazor.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        :root {
            --primary-lavender: #9d8ec7;
            --primary-hover: #8876b5;
            --bg-lavender: #f4f0fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --correct-color: #28a745;
            --incorrect-color: #dc3545;
        }
    
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-lavender);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
    
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(157, 142, 199, 0.2);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
    
        button {
            background-color: var(--primary-lavender);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
    
        button:hover {
            background-color: var(--primary-hover);
        }
    
        .btn-main {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 18px;
        }
    
        .btn-secondary {
            background-color: #e0d8f0;
            color: #4a3e6d;
            margin: 5px;
        }
    
        .btn-secondary.active {
            background-color: var(--primary-lavender);
            color: white;
        }
    
        .btn-finish {
            background-color: #d9777f;
            margin-top: 20px;
            width: 100%;
        }
    
        .btn-finish:hover {
            background-color: #c55d65;
        }
    
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
    
        th,
        td {
            border: 1px solid #e0d8f0;
            padding: 10px;
            text-align: left;
        }
    
        th {
            background-color: var(--bg-lavender);
            color: #5a4b82;
        }
    
        .card {
            background: #faf8fc;
            border: 2px solid #e8e1f5;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
        }
    
        .word-prompt {
            font-size: 26px;
            font-weight: bold;
            color: #4a3e6d;
        }
    
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
    
        .option-btn {
            background-color: white;
            color: var(--text-color);
            border: 2px solid #e0d8f0;
            padding: 14px;
            border-radius: 8px;
        }
    
        .option-btn:hover {
            background-color: var(--bg-lavender);
        }
    
        .option-btn.btn-correct {
            background-color: var(--correct-color) !important;
            color: white !important;
        }
    
        .option-btn.btn-incorrect {
            background-color: var(--incorrect-color) !important;
            color: white !important;
        }
    
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #e0d8f0;
            border-radius: 8px;
            font-size: 16px;
        }
    
        .comment-hint {
            margin-top: 10px;
            font-weight: bold;
            color: var(--incorrect-color);
            font-size: 15px;
        }
    
        .mistakes-list {
            text-align: left;
            background: #fff5f5;
            padding: 15px 25px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid var(--incorrect-color);
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
